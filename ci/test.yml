name: tests

# The trie utilities are written in AQL, so CI builds the `aql` interpreter
# from source before running anything. AQL has no tagged release yet and has
# shipped breaking changes between commits, so we pin AQL_REF to the exact
# commit this library is verified against. Bump it (and re-run the suites
# locally) when adopting a newer aql.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # aql-lang/aql @ main, 2026-06-06.
  AQL_REF: db828ecb6ee1d161ff177134478f42c56484f051

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trie
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The compiled binary only depends on AQL_REF (and the OS), so a hit
      # here lets us skip the clone + build entirely.
      - name: Cache aql binary
        id: cache-aql
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/aql
          key: aql-${{ env.AQL_REF }}-${{ runner.os }}

      - name: Check out aql source
        if: steps.cache-aql.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: aql-lang/aql
          ref: ${{ env.AQL_REF }}
          path: aql-src

      # The documented `go install …/cmd/go/aql@latest` cannot work while
      # cmd/go/go.mod carries replace directives, so we build from the clone
      # with -mod=mod instead.
      - name: Build aql
        if: steps.cache-aql.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cd aql-src/cmd/go
          GOFLAGS=-mod=mod go build \
            -ldflags "-X github.com/aql-lang/aql/cmd/go.Version=${AQL_REF}" \
            -o "$HOME/.local/bin/aql" ./aql

      - name: Add aql to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report aql version
        run: aql -version

      # Each suite ends with `0 test.fail-count end assert.equal`, so a
      # failure makes aql exit non-zero and fails the step.
      - name: Unit tests — standard trie
        run: aql test/trie_test.aql
      - name: Unit tests — radix tree
        run: aql test/radix_test.aql
      - name: Unit tests — ternary search tree
        run: aql test/tst_test.aql
      - name: Unit tests — burst trie
        run: aql test/burst_test.aql

      - name: Property tests — standard trie (spec)
        run: aql test/trie_prop_spec.aql
      - name: Property tests — standard trie (pbt)
        run: aql test/trie_pbt.aql
      - name: Property tests — radix tree
        run: aql test/radix_prop_spec.aql
      - name: Property tests — ternary search tree
        run: aql test/tst_prop_spec.aql
      - name: Property tests — burst trie
        run: aql test/burst_prop_spec.aql

      - name: Smoke demo
        run: aql test/smoke.aql
