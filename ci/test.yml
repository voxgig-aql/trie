name: tests

# The trie utilities are written in boru, so CI builds the `boru` interpreter
# from source before running anything. boru has no tagged release yet and has
# shipped breaking changes between commits, so we pin BORU_REF to the exact
# commit this library is verified against. Bump it (and re-run the suites
# locally) when adopting a newer aql.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trie
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The compiled binary only depends on BORU_REF (and the OS), so a hit
      # here lets us skip the clone + build entirely.
      - name: Resolve boru main HEAD
        id: boruref
        run: echo "sha=$(git ls-remote https://github.com/boru-lang/boru.git main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache boru binary
        id: cache-boru
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/boru
          key: boru-${{ steps.boruref.outputs.sha }}-${{ runner.os }}

      - name: Check out boru source
        if: steps.cache-boru.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: boru-lang/boru
          ref: ${{ steps.boruref.outputs.sha }}
          path: boru-src

      # The documented `go install …/cmd/go/aql@latest` cannot work while
      # cmd/go/go.mod carries replace directives, so we build from the clone
      # with -mod=mod instead.
      - name: Build boru
        if: steps.cache-boru.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cd boru-src/cmd/go
          GOWORK=off GOFLAGS=-mod=mod go build \
            -ldflags "-X github.com/boru-lang/boru/cmd/go.Version=${{ steps.boruref.outputs.sha }}" \
            -o "$HOME/.local/bin/boru" ./boru

      - name: Add boru to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report boru version
        run: boru -version

      # Each suite ends with `0 test.fail-count end assert.equal`, so a
      # failure makes boru exit non-zero and fails the step.
      #
      # INTERPRETER IS A HARD GATE for every suite — the supported execution
      # path, and always green.
      - name: Unit tests — interpreter (HARD GATE)
        run: |
          for f in trie radix tst burst; do
            echo "::group::boru test/${f}_unit_test.aql"
            boru "test/${f}_unit_test.aql"
            echo "::endgroup::"
          done
      - name: Unit spec — standard trie (interpreter)
        run: boru test/trie_unit_spec.aql

      - name: Property tests — standard trie (spec)
        run: boru test/trie_prop_spec.aql
      - name: Property tests — standard trie (direct)
        run: boru test/trie_prop_test.aql
      - name: Property tests — radix tree
        run: boru test/radix_prop_spec.aql
      - name: Property tests — ternary search tree
        run: boru test/tst_prop_spec.aql
      - name: Property tests — burst trie
        run: boru test/burst_prop_spec.aql

      - name: Smoke demo
        run: boru test/trie_smoke_test.aql

      # Static check — HARD GATE. `boru check` exits non-zero on any
      # error-level diagnostic. The upstream checker-precision work (gradual
      # `Any` carriers, `/r` reference-export use-tracing, the `do{}`-param and
      # dynamic-`set` fixes) landed, so every suite AND every module now checks
      # 0 errors — what used to be ~150–300 false positives per module. Gating
      # here guards against a regression on either side. (`unused_def` and
      # similar live at warning level and do not fail the step.)
      # Verified clean on the pinned ref; see boru-MAIN-VERIFICATION.md §8 and
      # upstream design/CLIENT-VERIFICATION-MAIN-2026-06-24.md.
      - name: Static check — suites + modules (HARD GATE, 0 errors)
        run: |
          for f in test/*.aql trie.aql radix.aql tst.aql burst.aql; do
            echo "::group::boru check $f"
            boru check "$f"
            echo "::endgroup::"
          done

      # Bytecode compiler (`--force-compile`, the strict path that refuses
      # rather than falling back) — ADVISORY, and steadily improving upstream.
      # As of the pinned ref all four `*_prop_spec` suites compile (the `each`
      # and dynamic-help `check diagnostics` refusals are gone); the remaining
      # frontier is `fold`/`each`/`test-test` code-bodies, `loop results as fn
      # args` (Stage 3), and one `unknown provenance` case — tracked, deferred
      # upstream emitter work (design/COMPILABLE-SUBSET.md; proposals/aql-full-
      # compilation.md). `--compile` (silent interpreter fallback) matches the
      # interpreter on every suite, so this is a coverage gap, not a
      # correctness bug. Promote to a gate once the emitter closes those words.
      - name: Bytecode compiler — suites (advisory)
        continue-on-error: true
        run: |
          for f in test/*.aql; do
            echo "::group::boru --force-compile $f"
            boru --force-compile "$f" || echo "::warning::--force-compile refused for $f (deferred upstream)"
            echo "::endgroup::"
          done

  # Lightweight guard for the agent-skill packaging and the pinned-ref single
  # source of truth (no boru needed). The plugin must bundle its own copy of the
  # skill — plugins can't point at an external .claude/skills dir — so two
  # copies exist and can drift; and the boru commit is pinned in several files
  # that must agree.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trie
        uses: actions/checkout@v4

      - name: SKILL.md copies are in sync
        run: |
          canonical=.claude/skills/trie-aql/SKILL.md
          bundled=plugins/trie-aql/skills/trie-aql/SKILL.md
          if ! diff -u "$canonical" "$bundled"; then
            echo "::error file=$bundled::Plugin skill has drifted from $canonical"
            echo "Fix by copying the canonical skill over the bundled one:"
            echo "  cp $canonical $bundled"
            exit 1
          fi
          echo "SKILL.md copies are identical."

      - name: JSON manifests are valid
        run: |
          for j in .claude-plugin/marketplace.json \
                   plugins/trie-aql/.claude-plugin/plugin.json \
                   api.json; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$j"; then
              echo "ok: $j"
            else
              echo "::error file=$j::invalid JSON"
              exit 1
            fi
          done
